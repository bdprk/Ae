name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build and registry
        uses: Swatinem/rust-cache@v2
      - name: Check C compiler
        run: gcc --version
      - name: Test verification scripts
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Byte-parity gate vs the previous main (M0.2.08)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/ab_gate.py --baseline origin/${{ github.base_ref }}
      - name: Master checklist is current (R5.1)
        run: |
          python scripts/gen_checklist.py
          git diff --exit-code docs/checklist.md
      - name: Test
        run: cargo test --workspace --locked
      - name: Verify generated C (Linux sanitizers)
        if: runner.os == 'Linux'
        run: python3 scripts/verify_generated_c.py --sanitize
      - name: Verify generated C (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_generated_c.py
