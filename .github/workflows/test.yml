name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check C compiler
        run: gcc --version
      - name: Test
        run: cargo test --locked
      - name: Verify generated C (Linux sanitizers)
        if: runner.os == 'Linux'
        run: python3 scripts/verify_generated_c.py --sanitize
      - name: Verify generated C (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_generated_c.py
